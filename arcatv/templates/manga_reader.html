<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ manga.name }} cap. {{ chapter }} - ARCATV</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            overflow: hidden;
            background: #050505;
            color: #ffffff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .reader-toolbar {
            z-index: 20;
            display: grid;
            min-height: 58px;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
            border-bottom: 1px solid #262626;
            background: #151515;
            padding: 10px clamp(12px, 3vw, 24px);
        }

        .reader-title {
            min-width: 0;
            text-align: center;
        }

        .reader-title strong,
        .reader-title span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reader-title span {
            color: #b8b8b8;
            font-size: 0.9rem;
        }

        .reader-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .reader-button {
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            background: #252525;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 750;
            padding: 9px 13px;
            text-decoration: none;
            white-space: nowrap;
        }

        .reader-button:hover,
        .reader-button:focus-visible {
            background: #363636;
            outline: none;
        }

        .reader-main {
            position: relative;
            display: flex;
            min-height: 0;
            flex: 1;
            align-items: center;
            justify-content: center;
            background: #050505;
        }

        .reader-image {
            max-width: 100vw;
            max-height: calc(100vh - 58px);
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.78);
        }

        .touch-zones {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .touch-zone {
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .preview-thumbnail {
            position: fixed;
            bottom: 18px;
            left: 18px;
            z-index: 30;
            width: 82px;
            height: 118px;
            overflow: hidden;
            border: 2px solid #4f9b9f;
            border-radius: 8px;
            background: #000000;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
        }

        .preview-thumbnail[hidden] {
            display: none;
        }

        .preview-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.92);
            cursor: zoom-out;
        }

        .modal-overlay.is-open {
            display: flex;
        }

        .modal-overlay img {
            max-width: 96vw;
            max-height: 96vh;
            object-fit: contain;
        }

        @media (max-width: 660px) {
            .reader-toolbar {
                grid-template-columns: 1fr;
            }

            .reader-title {
                order: -1;
                text-align: left;
            }

            .reader-actions {
                justify-content: stretch;
            }

            .reader-actions .reader-button,
            .reader-toolbar > .reader-button {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header class="reader-toolbar">
        <a class="reader-button" href="{{ detail_url }}">Volver</a>
        <div class="reader-title">
            <strong>{{ manga.name }}</strong>
            <span id="reader-info">Cap. {{ chapter }}</span>
        </div>
        <div class="reader-actions">
            <button id="prev-btn" class="reader-button" type="button">Anterior</button>
            <button id="next-btn" class="reader-button" type="button">Siguiente</button>
        </div>
    </header>

    <main class="reader-main">
        <div class="touch-zones" aria-hidden="true">
            <button id="left-zone" class="touch-zone" type="button" tabindex="-1"></button>
            <button id="right-zone" class="touch-zone" type="button" tabindex="-1"></button>
        </div>
        <img id="reader-image" class="reader-image" alt="Capitulo {{ chapter }}">
    </main>

    <button id="preview-thumbnail" class="preview-thumbnail" type="button" title="Pagina completa">
        <img id="thumb-image" alt="Pagina completa">
    </button>

    <div id="modal-overlay" class="modal-overlay">
        <img id="modal-image" alt="Pagina completa">
    </div>

    <script>
        const pages = {{ pages|tojson }};
        const progressUrl = {{ progress_url|tojson }};
        const finishUrl = {{ finish_url|tojson }};
        const chapterLabel = {{ chapter|tojson }};
        let alreadyRead = {{ is_read|tojson }};
        let currentIndex = Math.min(Math.max({{ current_panel }} - 1, 0), pages.length - 1);
        let finishPrompted = false;

        const readerImage = document.querySelector("#reader-image");
        const readerInfo = document.querySelector("#reader-info");
        const thumbButton = document.querySelector("#preview-thumbnail");
        const thumbImage = document.querySelector("#thumb-image");
        const modalOverlay = document.querySelector("#modal-overlay");
        const modalImage = document.querySelector("#modal-image");

        function loadPanel(index, fromForward = false) {
            if (index < 0 || index >= pages.length) {
                return;
            }

            currentIndex = index;
            const page = pages[currentIndex];
            readerImage.src = page.url;
            readerInfo.textContent = `Cap. ${chapterLabel} - ${currentIndex + 1}/${pages.length}`;

            if (page.full_url) {
                thumbImage.src = page.full_url;
                modalImage.src = page.full_url;
                thumbButton.hidden = false;
            } else {
                thumbButton.hidden = true;
                thumbImage.removeAttribute("src");
                modalImage.removeAttribute("src");
            }

            saveProgress(false);
            if (fromForward && currentIndex === pages.length - 1) {
                window.setTimeout(offerFinish, 250);
            }

            const nextPage = pages[currentIndex + 1];
            if (nextPage) {
                const preload = new Image();
                preload.src = nextPage.url;
            }
        }

        function previousPanel() {
            loadPanel(currentIndex - 1);
        }

        function nextPanel() {
            if (currentIndex >= pages.length - 1) {
                offerFinish();
                return;
            }
            loadPanel(currentIndex + 1, true);
        }

        async function saveProgress(finished) {
            try {
                await fetch(finished ? finishUrl : progressUrl, {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        Accept: "application/json",
                    },
                    body: JSON.stringify({ panel: currentIndex + 1 }),
                });
            } catch {
                return;
            }
        }

        async function offerFinish() {
            if (alreadyRead || finishPrompted) {
                return;
            }

            finishPrompted = true;
            const accepted = window.confirm(`Has llegado al final del capitulo ${chapterLabel}. Marcarlo como leido?`);
            if (!accepted) {
                finishPrompted = false;
                return;
            }

            try {
                const response = await fetch(finishUrl, {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        Accept: "application/json",
                    },
                    body: JSON.stringify({ panel: currentIndex + 1 }),
                });
                if (!response.ok) {
                    throw new Error("No se pudo marcar el capitulo.");
                }
                alreadyRead = true;
                const payload = await response.json();
                readerInfo.textContent = payload.message || `Cap. ${chapterLabel} leido`;
            } catch {
                finishPrompted = false;
                window.alert("No se pudo marcar el capitulo como leido.");
            }
        }

        document.querySelector("#prev-btn").addEventListener("click", previousPanel);
        document.querySelector("#next-btn").addEventListener("click", nextPanel);
        document.querySelector("#left-zone").addEventListener("click", previousPanel);
        document.querySelector("#right-zone").addEventListener("click", nextPanel);

        thumbButton.addEventListener("click", () => {
            if (modalImage.src) {
                modalOverlay.classList.add("is-open");
            }
        });
        modalOverlay.addEventListener("click", () => modalOverlay.classList.remove("is-open"));

        window.addEventListener("keydown", (event) => {
            if (event.key === "ArrowRight" || event.key === " ") {
                event.preventDefault();
                nextPanel();
            }
            if (event.key === "ArrowLeft") {
                previousPanel();
            }
            if (event.key === "Escape") {
                modalOverlay.classList.remove("is-open");
            }
        });

        loadPanel(currentIndex);
    </script>
</body>
</html>
